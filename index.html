<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>六十四島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one nautical chart sheet. A single column moves from intro to voyage to passport to the 8x8 atlas of 64 islands. */
:root{
  --bg:#E7EDF1;
  --surface:#F5F8FA;
  --ink:#0E2233;
  --muted:#566B7B;
  --line:#B4C4D0;
  --grid:#DCE5EB;
  --wash:#D5E0E8;
  --accent:#C81E65;
  --accent-ink:#FFFFFF;
  --sea:#176F80;
  --display:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1620;--surface:#10212E;--ink:#DDE8EF;--muted:#8DA3B3;--line:#2A4251;--grid:#10222F;--wash:#173145;
    --accent:#FF5C98;--accent-ink:#1A0610;--sea:#4FC1D3;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1620;--surface:#10212E;--ink:#DDE8EF;--muted:#8DA3B3;--line:#2A4251;--grid:#10222F;--wash:#173145;
  --accent:#FF5C98;--accent-ink:#1A0610;--sea:#4FC1D3;color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.75;
  min-height:100vh;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:680px;margin:0 auto}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:28px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;display:flex;align-items:baseline;gap:10px;text-align:left}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em}
.brand[disabled]{cursor:default}
.brand.quiet b{display:none}
.top-r{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:1px solid var(--line);padding:6px 12px;min-height:36px;border-radius:3px;font-size:14px;color:var(--ink)}
.linkbtn:hover{border-color:var(--accent);color:var(--accent)}

/* buttons */
.btn{min-height:46px;padding:10px 22px;border:1px solid var(--ink);background:transparent;border-radius:3px;font-weight:500;letter-spacing:.04em}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-row.one{flex-wrap:nowrap;gap:clamp(6px,2vw,12px)}
.btn-row.one .btn{padding:10px clamp(6px,2.2vw,16px);font-size:clamp(12px,3.6vw,16px);letter-spacing:.02em;white-space:nowrap;min-width:0;flex:0 0 auto}
/* same size as 起航 on the main home */
.btn-row.one .btn.primary{padding:10px 22px;font-size:16px;letter-spacing:.04em;flex:0 0 auto}

/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:22px}
.hero h1{margin:0;white-space:nowrap;font-size:clamp(38px,12.5vw,88px)}
.hero .eyebrow{white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--sea);margin:0 0 6px}
h1{font-family:var(--display);font-size:clamp(52px,14vw,88px);line-height:1.05;margin:0 0 14px;letter-spacing:.06em;text-wrap:balance}
.lede{margin:0 0 22px;color:var(--ink)}
.rose{display:block;width:clamp(84px,24vw,190px);height:auto}
.facts{display:flex;gap:26px;margin:0 0 26px;padding:14px 0;border-block:1px solid var(--line);flex-wrap:wrap}
.facts div{display:flex;flex-direction:column;gap:0}
.facts dt{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em}
.facts dd{margin:0;font-family:var(--display);font-size:24px;line-height:1.3}
.note{margin:22px 0 0;font-size:14px;color:var(--muted);max-width:36em}
.note b{color:var(--ink);font-weight:500}

/* quiz */
.route{margin-bottom:22px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.chap{font-family:var(--display);font-size:22px;font-weight:700}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:1.5px dashed var(--line)}
.done{position:absolute;left:0;top:10px;height:3px;background:var(--accent);transition:width .35s ease}
.tick{position:absolute;top:5px;width:1px;height:13px;background:var(--ink);opacity:.5}
.boat{position:absolute;top:-4px;width:30px;margin-left:-15px;transition:left .35s ease;color:var(--ink)}
.chs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.chs span{padding-inline:2px;white-space:nowrap}
.chs .on{color:var(--accent);font-weight:500}

.scene{background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:26px 22px 22px;position:relative;outline-offset:-7px;animation:enter .32s ease both}
.scene::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.scene:focus{outline:none}
.loc{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--sea);margin:0 0 10px;position:relative}
.story{font-family:var(--display);font-size:clamp(21px,5.2vw,26px);line-height:1.6;margin:0 0 22px;text-wrap:balance;position:relative}
.choices{display:grid;gap:12px;position:relative}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:15px 16px;min-height:60px;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--accent);background:var(--wash)}
.choice.picked{border-color:var(--accent);background:var(--wash);transform:translateX(4px)}
.choice .key{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:3px;font-size:12px;margin-top:1px}
.choice.picked .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice span:last-child{min-width:0}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* passport / island card */
.passport{background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:22px 22px 26px;position:relative;animation:enter .4s ease both}
.passport::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.passport>*{position:relative}
.pp-head{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.2em;color:var(--sea);padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:18px;flex-wrap:wrap}
.pp-main{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.pp-main>div:first-child{min-width:0}
.code{font-size:clamp(38px,11vw,60px);line-height:1;margin:0 0 10px;font-weight:500;letter-spacing:.02em}
.code span{color:var(--accent);font-size:.55em;letter-spacing:.06em}
.pp-main .pn-name{font-family:var(--display);font-size:clamp(24px,6.4vw,32px);line-height:1.3;margin:0 0 6px;text-wrap:balance}
.pp-main h2{font-family:var(--display);font-size:clamp(24px,6.4vw,32px);line-height:1.3;margin:0 0 6px;text-wrap:balance}
.tag{margin:0;color:var(--muted);font-family:var(--display);font-size:18px}
.stamp{flex:none;width:92px;height:92px;border:2px solid var(--accent);border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--accent);transform:rotate(-12deg);outline:1px solid var(--accent);outline-offset:-7px;animation:stamp .55s cubic-bezier(.2,1.3,.4,1) .2s both}
.stamp-t{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15}
.stamp-s{font-size:9px;letter-spacing:.2em}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.desc{margin:20px 0 22px;max-width:36em}
.sec-t{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);margin:0 0 10px}
.bars{display:grid;gap:14px;margin-bottom:24px}
.bar-labels{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.4;margin-bottom:5px}
.bar-labels>div{display:flex;gap:6px;align-items:baseline;color:var(--muted)}
.bar-labels .win{color:var(--ink);font-weight:500}
.bar-labels b{font-family:var(--mono);font-weight:500}
.bar-labels .pc{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar-track{display:flex;height:10px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--bg)}
.bar-track i{display:block;height:100%;transition:width .6s ease}
.bar-track .win{background:var(--accent)}
.bar-track .lose{background:var(--wash)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{display:flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:3px;padding:3px 10px;font-size:14px;background:var(--bg)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--accent)}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;margin:0;padding-top:20px;border-top:1px dashed var(--line)}
.facts2 dt{font-family:var(--display);font-weight:700;font-size:18px;color:var(--sea);margin-bottom:2px}
.facts2 dd{margin:0;font-size:15px;line-height:1.7}
@media (max-width:560px){.facts2{grid-template-columns:1fr}}
.after{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.said{margin-top:12px;font-size:14px;color:var(--muted);user-select:all}

/* atlas */
.page-t{font-family:var(--display);font-size:clamp(32px,8vw,46px);line-height:1.2;margin:0 0 6px}
.page-s{margin:0 0 20px;color:var(--muted);max-width:34em}
.atlas-wrap{background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:14px 10px 12px;margin-bottom:18px}
.atlas{display:grid;grid-template-columns:38px repeat(8,minmax(0,1fr));gap:0}
.ch,.rh{font-family:var(--mono);font-size:10px;color:var(--muted);display:grid;place-items:center;letter-spacing:.02em}
.ch{height:26px}
.isle{aspect-ratio:1;min-width:0;padding:0;border:0;border-top:1px dotted var(--line);border-left:1px dotted var(--line);background:transparent;display:grid;place-items:center;border-radius:0}
.isle:hover{background:var(--wash)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.isle.got .dot{background:var(--accent);border-color:var(--accent)}
.isle.me .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent)}
.isle.sel{background:var(--wash);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 4px 0;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;gap:6px;align-items:center}
.legend .dot{width:8px;height:8px}
.legend .g .dot{background:var(--accent);border-color:var(--accent)}
.axis-note{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.6}

.jobs{list-style:none;margin:2px 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.jobs li{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:1px 10px;font-size:14px;line-height:1.7}
.work{margin:0;font-size:15px;color:var(--muted)}
.facts2 .wide{grid-column:1/-1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 0}
.fchip{min-height:40px;padding:6px 14px;border:1px solid var(--line);background:var(--surface);border-radius:3px;font-size:14px}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tgroup{margin-top:34px}
.tg-t{font-family:var(--display);font-size:26px;line-height:1.3;margin:0;display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.tg-t .mono{font-size:13px;color:var(--sea);letter-spacing:.16em}
.tbase{padding:22px 0 8px;border-bottom:1px dashed var(--line)}
.tb-h{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.code2{font-size:30px;font-weight:500;margin:0;line-height:1.1}
.tb-h h4{font-family:var(--display);font-size:24px;margin:0;line-height:1.3}
.tb-h .tag{font-size:16px}
.tbase .desc{margin:8px 0 16px}
.tbase .facts2{border-top:0;padding-top:0;margin-bottom:18px}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media (max-width:560px){.vars{grid-template-columns:1fr}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0;scroll-margin-top:20px}
.vcard.hit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.vcard header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.vcard header b{font-family:var(--display);font-size:20px}
.vcard header .mono{font-size:12px;color:var(--muted)}
.vcard header em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 8px}
.vcard header em.seen{color:var(--sea);border-color:var(--sea)}
.vcard p{margin:0 0 6px;font-size:15px;line-height:1.7}
.vcard .k{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--sea);margin-right:8px}
.foot-note{margin:26px 0 0;font-size:14px;color:var(--muted);max-width:36em}

.about{margin-top:52px;padding-top:30px;border-top:1px solid var(--ink)}
.about h2{font-family:var(--display);font-size:clamp(28px,7vw,38px);line-height:1.25;margin:0 0 10px;text-wrap:balance}
.about h3{font-family:var(--display);font-size:22px;line-height:1.4;margin:38px 0 6px}
.about .sub{margin:0 0 16px;color:var(--muted);max-width:36em;font-size:15px}
.about p.lead{margin:0;max-width:36em}
.axlist{display:grid;gap:10px}
.axrow{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 16px}
.axhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.axhead b{font-family:var(--display);font-size:19px}
.axhead .mono{font-size:12px;color:var(--muted);letter-spacing:.08em}
.axhead em{margin-left:auto;font-style:normal;font-size:12px;border:1px solid var(--line);color:var(--muted);border-radius:3px;padding:0 8px}
.axhead em.new{color:var(--accent);border-color:var(--accent)}
.axsides{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px;line-height:1.65}
.axsides span{min-width:0}
.axsides b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:6px}
@media (max-width:560px){.axsides{grid-template-columns:1fr}}
.formula{display:flex;align-items:center;gap:clamp(4px,1.6vw,12px);flex-wrap:nowrap;margin:14px 0 4px;font-family:var(--mono);font-size:clamp(11px,3.3vw,14px)}
.formula span{border:1px solid var(--ink);border-radius:3px;padding:2px clamp(5px,2vw,12px);background:var(--surface);white-space:nowrap}
.winds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:560px){.winds{grid-template-columns:1fr}}
.wind{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0}
.wind header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.wind header b{font-family:var(--display);font-size:22px}
.wind header .mono{font-size:12px;color:var(--sea);letter-spacing:.1em}
.wind p{margin:0;font-size:15px;line-height:1.7}
.tgs{display:grid;gap:10px;margin-top:14px}
.tgi{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px dashed var(--line)}
.tgi:first-child{border-top:0}
.tgi h4{font-family:var(--display);font-size:20px;margin:0;line-height:1.4}
.tgi h4 .mono{display:block;font-size:12px;color:var(--sea);letter-spacing:.14em}
.tgi p{margin:0 0 6px;font-size:15px}
.tgi .chips{margin:0}
.tgi .chip{font-size:13px;padding:1px 8px}
@media (max-width:560px){.tgi{grid-template-columns:1fr}}
.disclaim{margin:34px 0 22px;padding:14px 16px;border:1px dashed var(--line);border-radius:4px;font-size:14px;color:var(--muted)}
/* atlas: collapsed traits */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:9px;height:9px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);margin:-3px 4px 0 auto;transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.tbase{padding:0}
.tbase>summary.tb-h{display:flex;align-items:center;gap:16px;margin:0;padding:16px 4px;min-height:68px}
.tbase>summary.tb-h:hover{background:var(--wash)}
.tbn{display:flex;flex-direction:column;min-width:0}
.tbn b{font-family:var(--display);font-size:24px;line-height:1.3}
.tbn small{font-family:var(--display);font-size:16px;color:var(--muted);line-height:1.5}
.tb-body{padding:4px 4px 8px}
.tb-body .desc{margin:0 0 16px}
.vcard{padding:0}
.vcard>summary{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:12px 16px;min-height:52px}
.vcard>summary b{font-family:var(--display);font-size:20px}
.vcard>summary .mono{font-size:12px;color:var(--muted)}
.vcard>summary em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 8px;white-space:nowrap}
.vcard>summary em.seen{color:var(--sea);border-color:var(--sea)}
.vcard>summary em+*{}
.vcard>summary::after{margin-left:6px}
.vcard>summary em~*{}
.vbody{padding:0 16px 12px}
.vbody p:last-child{margin-bottom:0}
.vars{align-items:start}
.toggle-all{margin-left:auto}
/* atlas: island panel opened from the map */
#panel-wrap{margin-top:18px}
.hint-map{margin:0 4px 0;font-size:13px;color:var(--muted)}
.passport.panel{animation:enter .3s ease both}
.pn-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.pn-ctl .btn{min-height:40px;padding:6px 14px;font-size:14px}
.pn-ctl .close{margin-left:auto}
.sec{border-top:1px dashed var(--line);margin-top:6px}
.sec:first-of-type{margin-top:14px}
.sec>summary{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 2px;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.4}

/* ---------- ambient music (Web Audio, generated live) ---------- */
var Music=(function(){
  var AC=window.AudioContext||window.webkitAudioContext;
  var M={ok:!!AC,on:false};
  var ctx,master,send,timer,nextT=0,beat=0;
  var BEAT=0.8,BEATS=8;
  var CHORDS=[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,55,59]];
  var MEL=[[72,76,79,83,84],[72,76,79,81,84],[72,76,77,81,84],[74,76,79,81,83]];
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function note(freq,t,dur,vol,att,type,wet){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);
    if(wet){var s=ctx.createGain();s.gain.value=wet;g.connect(s);s.connect(send);}
    o.start(t);o.stop(t+dur+0.1);
  }
  function schedule(){
    if(!M.on)return;
    while(nextT<ctx.currentTime+1.2){
      var bar=Math.floor(beat/BEATS)%CHORDS.length,pos=beat%BEATS;
      if(pos===0){
        CHORDS[bar].forEach(function(m,i){
          note(hz(m),nextT+i*0.06,BEATS*BEAT+1.2,i===0?0.075:0.05,1.8,"sine",0.25);
          note(hz(m+12)*1.002,nextT+i*0.06,BEATS*BEAT+0.8,0.012,2.2,"triangle",0.3);
        });
      }
      if(Math.random()<(pos%2===0?0.7:0.35)){
        var set=MEL[bar],m=set[Math.floor(Math.random()*set.length)];
        note(hz(m),nextT+(Math.random()*0.06),2.2,0.085,0.015,"sine",0.55);
      }
      nextT+=BEAT;beat++;
    }
  }
  M.start=function(){
    if(!M.ok||M.on)return;
    try{
      if(!ctx){
        ctx=new AC();
        master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
        var d=ctx.createDelay(1.5);d.delayTime.value=BEAT*0.75;
        var fb=ctx.createGain();fb.gain.value=0.38;
        var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
        send=ctx.createGain();
        send.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(master);
      }
      if(ctx.resume)ctx.resume();
      M.on=true;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.55,ctx.currentTime+2.5);
      nextT=ctx.currentTime+0.1;beat=0;
      schedule();
      timer=setInterval(schedule,250);
    }catch(e){M.on=false;}
  };
  M.stop=function(){
    if(!M.on)return;
    M.on=false;
    clearInterval(timer);
    try{
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
      master.gain.linearRampToValueAtTime(0,ctx.currentTime+0.8);
    }catch(e){}
  };
  M.pause=function(){if(ctx&&M.on&&ctx.suspend)ctx.suspend();};
  M.resume=function(){if(ctx&&M.on&&ctx.resume)ctx.resume();};
  return M;
})();

/* ---------- sound effects: synthesized with Web Audio, no audio files ---------- */
var Au=(function(){
  var ctx=null,sfxG,noiseBuf,on=true;
  try{var j=JSON.parse(localStorage.getItem("islands64snd")||"null");if(j)on=j.s!==0;}catch(e){}
  function persist(){try{localStorage.setItem("islands64snd",JSON.stringify({s:on?1:0}));}catch(e){}}
  var SCALE=[523.25,587.33,659.25,783.99,880,1046.5];
  function init(){
    if(ctx)return true;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    try{ctx=new AC();}catch(e){ctx=null;return false;}
    var master=ctx.createGain();master.gain.value=0.8;master.connect(ctx.destination);
    var conv=ctx.createConvolver(),len=Math.floor(ctx.sampleRate*1.8),ir=ctx.createBuffer(2,len,ctx.sampleRate),c,i;
    for(c=0;c<2;c++){var d=ir.getChannelData(c);for(i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}}
    conv.buffer=ir;
    var wet=ctx.createGain();wet.gain.value=0.35;conv.connect(wet);wet.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=0.9;sfxG.connect(master);sfxG.connect(conv);
    var nl=ctx.sampleRate;noiseBuf=ctx.createBuffer(1,nl,ctx.sampleRate);
    var nd=noiseBuf.getChannelData(0);for(i=0;i<nl;i++){nd[i]=Math.random()*2-1;}
    return true;
  }
  function tone(dest,f,t,dur,type,vol,att){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
  }
  function bell(dest,f,t,vol,dur){
    tone(dest,f,t,dur,"sine",vol,0.01);
    tone(dest,f*2,t,dur*0.55,"sine",vol*0.22,0.01);
  }
  function unlock(){
    if(!init())return;
    if(ctx.state==="suspended")ctx.resume();
  }
  function sfx(n,a){
    if(!on||!ctx||ctx.state==="closed")return;
    var t=ctx.currentTime+0.01;
    if(n==="tick"){tone(sfxG,1250,t,0.07,"triangle",0.12,0.004);}
    else if(n==="pick"){
      var f=a?783.99:659.25;
      tone(sfxG,f,t,0.4,"triangle",0.34,0.005);
      tone(sfxG,f*2,t,0.2,"sine",0.08,0.005);
    }
    else if(n==="wave"){
      var s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
      s.buffer=noiseBuf;fl.type="lowpass";fl.Q.value=0.7;
      fl.frequency.setValueAtTime(250,t);
      fl.frequency.exponentialRampToValueAtTime(1400,t+0.25);
      fl.frequency.exponentialRampToValueAtTime(300,t+0.55);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.16,t+0.22);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      s.connect(fl);fl.connect(g);g.connect(sfxG);s.start(t);s.stop(t+0.65);
    }
    else if(n==="chapter"){
      [659.25,783.99,1046.5].forEach(function(f,k){bell(sfxG,f,t+k*0.12,0.26,1.6);});
      sfx("wave");
    }
    else if(n==="start"){
      var o=ctx.createOscillator(),g2=ctx.createGain();
      o.type="sine";o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+0.4);
      g2.gain.setValueAtTime(0.0001,t);g2.gain.linearRampToValueAtTime(0.2,t+0.1);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g2);g2.connect(sfxG);o.start(t);o.stop(t+0.55);
      bell(sfxG,1046.5,t+0.35,0.22,1.4);
    }
    else if(n==="arrive"){
      [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,k){bell(sfxG,f,t+k*0.11,0.26,1.8);});
      var o2=ctx.createOscillator(),g3=ctx.createGain(),ts=t+0.25;
      o2.type="sine";o2.frequency.setValueAtTime(140,ts);o2.frequency.exponentialRampToValueAtTime(45,ts+0.35);
      g3.gain.setValueAtTime(0.5,ts);g3.gain.exponentialRampToValueAtTime(0.0001,ts+0.4);
      o2.connect(g3);g3.connect(sfxG);o2.start(ts);o2.stop(ts+0.45);
    }
    else if(n==="isle"){
      bell(sfxG,SCALE[(a||0)%SCALE.length],t,0.3,1.1);
    }
  }
  return {
    get s(){return on;},
    setS:function(v){on=v;persist();if(v)unlock();},
    sfx:sfx,unlock:unlock
  };
})();

/* ---------- result image: drawn on a canvas, height measured first so nothing runs past the edge ---------- */
var Shot=(function(){
  var W=1080,PAD=84,CW=W-PAD*2;
  var C={bg:"#F5F8FA",ink:"#0E2233",muted:"#566B7B",line:"#B4C4D0",wash:"#D5E0E8",accent:"#C81E65",sea:"#176F80"};
  var DISP='"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif';
  var BODY='"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
  var MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
  var CLOSE="，。、；：！？）」』】》…,.;:!?)]}";
  function wrap(ctx,text,maxW){
    var toks=text.match(/[A-Za-z0-9][A-Za-z0-9\-_.%]*|[\s\S]/g)||[],lines=[],cur="";
    toks.forEach(function(t){
      var test=cur+t;
      if(cur&&ctx.measureText(test).width>maxW&&CLOSE.indexOf(t)<0&&!/^\s$/.test(t)){lines.push(cur);cur=t;}
      else cur=test;
    });
    if(cur)lines.push(cur);
    return lines;
  }
  function run(ctx,m,draw){
    var y=PAD-8;
    function T(s,x,cy,font,color,align){
      ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||"left";ctx.textBaseline="middle";
      if(draw)ctx.fillText(s,x,cy);
      return ctx.measureText(s).width;
    }
    function P(s,x,maxW,font,color,lh){
      ctx.font=font;
      var ls=wrap(ctx,s,maxW);
      for(var i=0;i<ls.length;i++){T(ls[i],x,y+lh*i+lh/2,font,color);}
      y+=ls.length*lh;
    }
    function dash(){
      if(!draw)return;
      ctx.save();ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.setLineDash([10,10]);
      ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();ctx.restore();

    y+=118;

    y+=4;
    P(m.tag,PAD,mainW,"400 34px "+DISP,C.muted,50);
    if(draw){
      ctx.save();ctx.translate(W-PAD-100,top+112);ctx.rotate(-12*Math.PI/180);
      ctx.strokeStyle=C.accent;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,92,0,7);ctx.stroke();
      ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,80,0,7);ctx.stroke();
      T(m.stamp,0,-8,"700 42px "+DISP,C.accent,"center");
      T("ARRIVED",0,32,"400 16px "+MONO,C.accent,"center");
      ctx.restore();
    }
    y=Math.max(y,top+232)+22;
    /* description */
    P(m.desc,PAD,CW,"400 32px "+BODY,C.ink,56);
    /* axes */
    y+=30;
    T(m.axTitle,PAD,y+12,"400 22px "+MONO,C.muted);y+=44;
    m.axes.forEach(function(a){
      var lf=a.lw?"700 ":"400 ",lc=a.lw?C.ink:C.muted,rf=a.lw?"400 ":"700 ",rc=a.lw?C.muted:C.ink;
      var x=PAD;
      x+=T(a.ll,x,y+16,"500 26px "+MONO,a.lw?C.accent:C.muted)+10;
      x+=T(a.ln,x,y+16,lf+"28px "+BODY,lc)+10;
      T(a.pl+"%",x,y+17,"400 24px "+MONO,lc);
      var xr=W-PAD;
      xr-=T(a.rl,xr,y+16,"500 26px "+MONO,a.lw?C.muted:C.accent,"right")+10;
      xr-=T(a.rn,xr,y+16,rf+"28px "+BODY,rc,"right")+10;
      T((100-a.pl)+"%",xr,y+17,"400 24px "+MONO,rc,"right");
      y+=40;
      if(draw){
        var bw=Math.round(CW*a.pl/100);
        ctx.fillStyle=C.wash;ctx.fillRect(PAD,y,CW,18);
        ctx.fillStyle=C.accent;
        if(a.lw)ctx.fillRect(PAD,y,bw,18);else ctx.fillRect(PAD+bw,y,CW-bw,18);
        ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(PAD,y,CW,18);
      }
      y+=18+30;
    });
    /* facts */
    y+=6;dash();y+=34;
    m.facts.forEach(function(f){
      T(f[0],PAD,y+20,"700 32px "+DISP,C.sea);y+=48;
      P(f[1],PAD,CW,"400 30px "+BODY,C.ink,50);
      y+=22;
    });
    /* careers */
    T("職涯方向",PAD,y+20,"700 32px "+DISP,C.sea);y+=54;
    var cx=PAD;
    m.jobs.forEach(function(j){
      ctx.font="400 28px "+BODY;
      var w=ctx.measureText(j).width+44;
      if(cx+w>W-PAD){cx=PAD;y+=64;}
      if(draw){
        ctx.fillStyle=C.bg;ctx.fillRect(cx,y,w,52);
        ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.strokeRect(cx,y,w,52);
      }
      T(j,cx+22,y+27,"400 28px "+BODY,C.ink);
      cx+=w+12;
    });
    y+=52+18;
    P(m.jobsNote,PAD,CW,"400 28px "+BODY,C.muted,46);
    /* footer */
    y+=20;dash();y+=36;
    T(m.foot,W/2,y+12,"400 22px "+MONO,C.muted,"center");y+=36;
    T("以情境題做簡化的娛樂測驗，非官方 MBTI 評量",W/2,y+12,"400 22px "+BODY,C.muted,"center");y+=34;
    return y+PAD-24;
  }
  function texts(m){
    var a=[m.label,m.coord,m.four,m.suf,m.name,m.tag,m.stamp,m.desc,m.axTitle,m.jobsNote,m.foot,"以情境題做簡化的娛樂測驗，非官方 MBTI 評量","職涯方向","ARRIVED0123456789%"];
    m.axes.forEach(function(x){a.push(x.ll,x.ln,x.rl,x.rn);});
    m.facts.forEach(function(f){a.push(f[0],f[1]);});
    m.jobs.forEach(function(j){a.push(j);});
    return a.join("");
  }
  async function loadFonts(m){
    try{
      if(!document.fonts||!document.fonts.load)return;
      var t=texts(m);
      var specs=["400 30px "+BODY,"500 30px "+BODY,"700 30px "+BODY,"700 56px "+DISP,"400 34px "+DISP,"500 30px "+MONO,"400 30px "+MONO];
      await Promise.race([Promise.all(specs.map(function(s){return document.fonts.load(s,t);})),new Promise(function(r){setTimeout(r,4000);})]);
    }catch(e){}
  }
  async function make(m){
    await loadFonts(m);
    var cv=document.createElement("canvas");cv.width=W;cv.height=200;
    var ctx=cv.getContext("2d");
    var H=Math.ceil(run(ctx,m,false));
    cv.height=H;ctx=cv.getContext("2d");
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.strokeRect(24,24,W-48,H-48);
    ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.strokeRect(38,38,W-76,H-76);
    run(ctx,m,true);
    return new Promise(function(res,rej){cv.toBlob(function(b){if(b)res(b);else rej(new Error("toBlob"));},"image/png");});
  }
  return {make:make};
})();

function blobToDataUrl(b){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});
}
function setShotMsg(t){var el=document.getElementById("shotmsg");if(el)el.textContent=t;}
async function saveShot(){
  if(!Dl||!shotBlob)return;
  try{
    await Dl.save({filename:shotName,data:shotBlob});
    setShotMsg("已送出儲存。");
  }catch(e){
    var c=e&&e.code;
    setShotMsg(c==="declined"?"已取消儲存，可以按「儲存到裝置」再試一次。":"這個畫面無法直接儲存，請長按（電腦請按右鍵）上方圖片另存。");
  }
}
async function doShot(){
  if(shotBusy)return;
  shotBusy=true;
  var btn=document.getElementById("shotbtn"),old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="產生中…";}
  try{
    var m=shotModel();
    shotBlob=await Shot.make(m);shotName=m.file;
    var url=await blobToDataUrl(shotBlob);
    var box=document.getElementById("shot");
    if(box){
      box.hidden=false;
      box.innerHTML='<img src="'+url+'" alt="'+m.four+m.suf+' 結果圖片">'+
        '<p id="shotmsg">'+(Dl?'已產生圖片，請在彈出的視窗確認儲存。沒有跳出的話，按下面的按鈕。':'已產生圖片。手機請長按圖片，電腦請按右鍵，選擇儲存圖片。')+'</p>'+
        '<div class="btn-row">'+(Dl?'<button class="btn" data-act="shotsave">儲存到裝置</button>':'')+'<button class="btn ghost" data-act="shotclose">關閉預覽</button></div>';
      var im=box.querySelector("img");
      if(im&&im.scrollIntoView){var rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;im.scrollIntoView({behavior:rm?"auto":"smooth",block:"nearest"});}
    }
    saveShot();
  }catch(e){
    var b2=document.getElementById("shot");
    if(b2){b2.hidden=false;b2.innerHTML='<p id="shotmsg">圖片產生失敗，請稍後再試。</p>';}
  }finally{

  }
}

  var cur=S.order[S.i],qq=chs()[cur.c].qs[cur.k],flip=S.flip[S.i];
  var o=flip?[qq.c[1],qq.c[0]]:[qq.c[0],qq.c[1]];

  S.lock=true;
  Au.sfx("pick",k);
  var btn=root.querySelectorAll(".choice")[k];if(btn)btn.classList.add("picked");
  setTimeout(function(){
    S.ans[S.i]=o[k][0];
    S.lock=false;
    if(S.i>=S.order.length-1){finish();toTop();}
    else{var nc=S.order[S.i+1].c!==cur.c;S.i++;render();Au.sfx(nc?"chapter":"wave");}
  },240);
}
function back(){
  if(S.lock)return;
  if(S.i===0){S.screen=S.mode==="ex"?"exintro":"intro";render();return;}
  S.i--;S.ans.length=S.i;render();
}
function copyResult(){
  var text;
  if(S.screen==="exresult"){var X=infoEx(S.exMine);text="我在「六十四島外傳・新世界」抵達了 "+X.code+"｜"+X.name+"（"+X.b.tag+"）";}
  else{var I=info(S.mine);text="我在「六十四島」抵達了 "+I.code+"｜"+I.name+"（"+I.b.tag+"）";}
  var btn=document.getElementById("copybtn"),said=document.getElementById("said");
  function ok(){if(btn){btn.textContent="已複製";setTimeout(function(){btn.textContent="複製結果";},1800);}}
  function fail(){
    if(said){said.hidden=false;said.textContent=text;}
    if(btn)btn.textContent="請手動複製下方文字";
  }
  try{
    navigator.clipboard.writeText(text).then(ok,fail);
  }catch(e){fail();}
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-pick],[data-code],[data-nav],[data-xcode],[data-xnav]");
  if(!t)return;
  if(t.hasAttribute("data-pick")){pick(+t.getAttribute("data-pick"));return;}
  if(t.hasAttribute("data-code")){
    var code=t.getAttribute("data-code");
    Au.sfx("isle",idxOf(code)&7);
    var wrap=document.getElementById("panel-wrap");
    if(S.sel===code&&wrap&&!wrap.hidden)hidePanel();else showPanel(code,true);
    return;
  }
  if(t.hasAttribute("data-xcode")){
    var xc=t.getAttribute("data-xcode");
    Au.sfx("isle",idxEx(xc)&7);
    var xw=document.getElementById("panel-wrap-x");
    if(S.exSel===xc&&xw&&!xw.hidden)hidePanelEx();else showPanelEx(xc,true);
    return;
  }
  if(t.hasAttribute("data-xnav")){
    if(!S.exSel)return;
    Au.sfx("tick");
    var xn=(idxEx(S.exSel)+(+t.getAttribute("data-xnav"))+256)%256;
    showPanelEx(codeAtEx(xn>>4,xn&15),false);
    return;
  }
  if(t.hasAttribute("data-nav")){
    if(!S.sel)return;
    Au.sfx("tick");
    var n=(idxOf(S.sel)+(+t.getAttribute("data-nav"))+64)%64;
    showPanel(codeAt(n>>3,n&7),false);
    return;
  }
  var a=t.getAttribute("data-act");
  if(a==="sfx"){Au.setS(!Au.s);renderTop();Au.sfx("tick");return;}
  Au.sfx(a==="start"||a==="startx"?"start":"tick");
  if(a==="start"){startGame("main");toTop();}
  else if(a==="startx"){startGame("ex");toTop();}
  else if(a==="back")back();
  else if(a==="atlas"){S.sel=null;S.screen="atlas";render();toTop();}
  else if(a==="intro"){if(S.screen!=="quiz"){S.screen="intro";render();toTop();}}
  else if(a==="copy")copyResult();
  else if(a==="shot")doShot();
  else if(a==="shotsave")saveShot();
  else if(a==="shotclose"){var sb=document.getElementById("shot");if(sb){sb.hidden=true;sb.innerHTML="";}}
  else if(a==="closepanel")hidePanel();
  else if(a==="closexpanel")hidePanelEx();
  else if(a==="exintro"){if(S.screen!=="quiz"){S.screen="exintro";render();toTop();}}
  else if(a==="exatlas"){S.exSel=null;S.screen="exatlas";render();toTop();}
  else if(a==="music"){
    wantAuto=false;
    if(Music.on){Music.stop();setMusicPref(false);}else{Music.start();setMusicPref(Music.on);}
    renderTop();
  }
});
document.addEventListener("change",function(e){
  var id=e.target&&e.target.id;
  if(id!=="selx-f"&&id!=="selx-w")return;
  var f=document.getElementById("selx-f").value||GROUPS[0].l[0];
  var w=document.getElementById("selx-w").value||"AH-CL";
  Au.sfx("isle",3);
  showPanelEx(f+"-"+w,true);
});
document.addEventListener("pointerdown",function(){Au.unlock();},true);
document.addEventListener("keydown",function(){Au.unlock();},true);
document.addEventListener("keydown",function(e){
  if(S.screen!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="1"||e.key==="a"||e.key==="A")pick(0);
  else if(e.key==="2"||e.key==="b"||e.key==="B")pick(1);
  else if(e.key==="ArrowLeft"||e.key==="Backspace"){e.preventDefault();back();}
});

/* music begins as the page opens; the browser keeps the audio paused until the first touch, click or key press, which wakes it up */
function wakeMusic(){if(Music.ok&&Music.on)Music.resume();}
["pointerdown","touchend","keydown","click"].forEach(function(t){document.addEventListener(t,wakeMusic,true);});
if(wantAuto&&Music.ok){wantAuto=false;Music.start();}
document.addEventListener("visibilitychange",function(){
  if(document.hidden)Music.pause();else Music.resume();
});

render();
})();
</script>

</body></html>
